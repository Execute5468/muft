pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Sponge'
			url = uri('https://repo.spongepowered.org/repository/maven-public')
		}
		gradlePluginPortal()
		mavenCentral()
	}
}

plugins {
	id "org.gradle.toolchains.foojay-resolver-convention" version("1.0.0")
}

rootProject.name = 'muft'
include('common')
include('fabric')
include('neoforge')